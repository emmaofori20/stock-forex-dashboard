<app-toast-container />
<a href="#main-content" class="skip-link">Skip to content</a>
<aside
  id="desktop-navigation"
  class="fixed inset-y-0 left-0 hidden overflow-x-hidden transition-[width] duration-200 motion-reduce:transition-none lg:block"
  [class]="isSidebarCollapsed ? 'w-20' : 'w-64'"
>
  <app-sidebar [collapsed]="isSidebarCollapsed" />
</aside>
@if (isMobileSidebarOpen) {
  <div class="fixed inset-0 z-50 lg:hidden" (keydown)="trapFocus($event)">
    <button
      type="button"
      tabindex="-1"
      aria-label="Close navigation backdrop"
      class="absolute inset-0 bg-heading/50"
      (click)="closeMobileSidebar()"
    ></button>
    <aside
      #drawer
      id="mobile-navigation"
      role="dialog"
      aria-modal="true"
      aria-label="Navigation"
      class="absolute inset-y-0 left-0 w-[min(20rem,88vw)]"
    >
      <button
        #closeButton
        type="button"
        aria-label="Close navigation"
        (click)="closeMobileSidebar()"
        class="absolute right-3 top-3 rounded-md p-2 text-white"
      >
        <app-icon name="close" /></button
      ><app-sidebar (navigate)="closeMobileSidebar()" />
    </aside>
  </div>
}
<div
  class="min-h-screen min-w-0 transition-[margin-left] duration-200 motion-reduce:transition-none"
  [class]="isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'"
  #content
  [attr.inert]="isMobileSidebarOpen ? '' : null"
>
  <app-navbar
    [isMobileSidebarOpen]="isMobileSidebarOpen"
    [isSidebarCollapsed]="isSidebarCollapsed"
    (toggleDesktop)="toggleSidebar()"
    (toggleMobile)="toggleMobileSidebar()"
  />
  <main id="main-content" tabindex="-1" class="mx-auto max-w-[1440px] px-5 py-8 sm:px-9 sm:py-10">
    <router-outlet />
  </main>
  <footer
    class="mx-5 mt-4 flex flex-wrap justify-between gap-2 border-t border-border py-6 text-[11px] text-body sm:mx-9"
  >
    <span>MarketDash </span><span>Alpha Vantage </span>
  </footer>
</div>
