<app-toast-container />
<a href="#main-content" class="skip-link">Skip to content</a>
<aside class="fixed inset-y-0 left-0 hidden w-64 lg:block"><app-sidebar /></aside>
@if (mobileOpen) {
  <div class="fixed inset-0 z-50 lg:hidden" (keydown)="trapFocus($event)">
    <div class="absolute inset-0 bg-heading/50" (click)="closeMenu()"></div>
    <aside
      #drawer
      id="mobile-navigation"
      role="dialog"
      aria-modal="true"
      aria-label="Navigation"
      class="absolute inset-y-0 left-0 w-[min(20rem,88vw)]"
    >
      <button
        #closeButton
        type="button"
        aria-label="Close navigation"
        (click)="closeMenu()"
        class="absolute right-3 top-3 rounded-md p-2 text-white"
      >
        <app-icon name="close" /></button
      ><app-sidebar (navigate)="closeMenu()" />
    </aside>
  </div>
}
<div class="min-h-screen min-w-0 lg:ml-64">
  <app-navbar [mobileOpen]="mobileOpen" (toggle)="openMenu()" />
  <main id="main-content" tabindex="-1" class="mx-auto max-w-[1440px] px-5 py-8 sm:px-9 sm:py-10">
    <router-outlet />
  </main>
  <footer
    class="mx-5 mt-4 flex flex-wrap justify-between gap-2 border-t border-border py-6 text-[11px] text-body sm:mx-9"
  >
    <span>MarketDash / A little more market perspective.</span
    ><span>Alpha Vantage / Daily history, not live streaming</span>
  </footer>
</div>
