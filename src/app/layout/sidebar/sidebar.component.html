<div class="flex h-full flex-col bg-sidebar px-5 pb-6 pt-8 text-white">
  <a
    routerLink="/"
    (click)="navigate.emit()"
    class="flex items-center gap-3 px-2 text-xl font-bold tracking-tight"
    ><span class="flex h-9 w-9 items-center justify-center rounded-lg bg-primary"
      ><app-icon name="stocks" /></span
    >MarketDash</a
  >
  <p
    class="mb-4 mt-12 px-3 text-[10px] font-semibold uppercase tracking-[0.18em] text-sidebar-muted"
  >
    Workspace
  </p>
  <nav aria-label="Main navigation" class="space-y-2">
    @for (item of links; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="nav-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="navigate.emit()"
        class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-white transition-colors hover:bg-white/5 hover:text-white"
        ><app-icon [name]="item.icon" />{{ item.label }}</a
      >
    }
  </nav>
  <div class="mt-auto pt-16"></div>
</div>
