<article
  class="pointer-events-auto flex gap-3 rounded-card border bg-surface p-4 shadow-lg"
  [class]="appearance.border"
  (mouseenter)="setHovered(true)"
  (mouseleave)="setHovered(false)"
  (focusin)="setFocused(true)"
  (focusout)="onFocusOut($event)"
>
  <span
    class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg"
    [class]="appearance.tone"
    ><app-icon [name]="appearance.icon"
  /></span>
  <div class="min-w-0 flex-1">
    <p class="text-sm font-semibold text-heading">{{ appearance.title }}</p>
    <p class="mt-1 break-words text-sm leading-5 text-body">{{ toast.message }}</p>
    @if (toast.type === 'error') {
      <p class="mt-2 text-[11px] text-body">Dismiss when you are ready.</p>
    }
  </div>
  <button
    type="button"
    (click)="dismissed.emit()"
    [attr.aria-label]="'Dismiss ' + toast.type + ' notification'"
    class="-mr-1 -mt-1 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-body transition-colors hover:bg-background hover:text-heading"
  >
    <app-icon name="close" class="!h-4 !w-4" />
  </button>
</article>
