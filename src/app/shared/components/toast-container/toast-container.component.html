<div class="sr-only" role="status" aria-live="polite" aria-atomic="true">
  {{ notifications.announcement()?.type !== 'error' ? notifications.announcement()?.message : '' }}
</div>
<div class="sr-only" role="alert" aria-live="assertive" aria-atomic="true">
  {{ notifications.announcement()?.type === 'error' ? notifications.announcement()?.message : '' }}
</div>
<section
  aria-label="Notifications"
  class="pointer-events-none fixed inset-x-3 top-3 z-[70] sm:left-auto sm:right-6 sm:top-6 sm:w-96 sm:max-w-[calc(100vw-3rem)]"
>
  <ul class="space-y-3">
    @for (toast of notifications.toasts(); track toast.id) {
      <li>
        <app-toast
          [toast]="toast"
          (dismissed)="notifications.dismiss(toast.id)"
          (pausedChange)="notifications.setPaused(toast.id, $event)"
        />
      </li>
    }
  </ul>
</section>
