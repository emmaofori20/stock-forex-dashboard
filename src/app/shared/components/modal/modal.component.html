<dialog
  #dialog
  [attr.aria-labelledby]="dialogId + '-title'"
  [attr.aria-describedby]="dialogId + '-message'"
  aria-modal="true"
  class="fixed inset-0 m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-lg overflow-y-auto rounded-2xl border border-border bg-surface p-0 text-body shadow-2xl"
  (cancel)="onCancel($event)"
  (click)="onBackdrop($event)"
  (keydown)="onKeydown($event)"
>
  <div class="p-6 sm:p-7">
    <div class="flex items-start justify-between gap-4">
      <h2 [id]="dialogId + '-title'" class="text-xl font-semibold tracking-tight text-heading">
        {{ title }}
      </h2>
      <button
        type="button"
        aria-label="Close dialog"
        (click)="dismiss()"
        class="-mr-2 -mt-2 flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-body hover:bg-background"
      >
        <app-icon name="close" />
      </button>
    </div>
    <p [id]="dialogId + '-message'" class="mt-4 whitespace-pre-line break-words text-sm leading-6">
      {{ message }}
    </p>
  </div>
  <div
    class="flex flex-col-reverse gap-3 border-t border-border bg-background px-6 py-4 sm:flex-row sm:justify-end"
  >
    <button
      #secondary
      type="button"
      (click)="onSecondary()"
      class="rounded-lg border border-border bg-surface px-4 py-3 text-xs font-semibold text-heading hover:bg-primary-light"
    >
      {{ secondaryLabel }}
    </button>
    @if (primaryLabel) {
      <button type="button" (click)="onPrimary()" class="primary-button">
        {{ primaryLabel }}
      </button>
    }
  </div>
</dialog>
